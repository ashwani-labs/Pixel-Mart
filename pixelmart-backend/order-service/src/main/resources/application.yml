server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pixelmart-db}?allowPublicKeyRetrieval=true&useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_schema: orders
  flyway:
    enabled: false

pixelmart:
  internal:
    allowed-services: catalog-service
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    internal-service-name: order-service
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    internal-service-name: order-service
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
    internal-service-name: order-service
  pincode:
    api-base-url: ${PINCODE_API_BASE_URL:https://api.postalpincode.in}
    cache-ttl-hours: ${PINCODE_CACHE_TTL_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info
