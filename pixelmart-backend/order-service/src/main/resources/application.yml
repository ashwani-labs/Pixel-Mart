server:
  port: 8083

spring:
  application:
    name: order-service
  profiles:
    active: local # switch to dev for TiDB Cloud
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

pixelmart:
  internal:
    allowed-services: catalog-service
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    internal-service-name: order-service
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    internal-service-name: order-service
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
    internal-service-name: order-service
  pincode:
    api-base-url: ${PINCODE_API_BASE_URL:https://api.postalpincode.in}
    cache-ttl-hours: ${PINCODE_CACHE_TTL_HOURS:24}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
