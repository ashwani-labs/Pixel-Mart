server:
  port: 8084

spring:
  application:
    name: notification-service
  profiles:
    active: local # switch to dev for TiDB Cloud
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

pixelmart:
  mail:
    from: ${MAIL_FROM:no-reply@pixelmart.local}
  internal:
    allowed-service: order-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
