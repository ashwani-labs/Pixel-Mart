# TiDB Cloud (set DB_HOST, DB_USERNAME, DB_PASSWORD in env or IntelliJ run config)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/notify?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        default_schema: notify

management:
  endpoint:
    health:
      show-details: when_authorized
