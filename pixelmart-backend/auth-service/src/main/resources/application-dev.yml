# TiDB Cloud (set DB_HOST, DB_USERNAME, DB_PASSWORD in env or IntelliJ run config)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/auth?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        default_schema: auth

pixelmart:
  auth:
    cookie:
      secure: true
      same-site: None

management:
  endpoint:
    health:
      show-details: when_authorized
